name: ellenorzes

on:
  push:
  pull_request:

jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesztek
        run: python3 -m unittest
      - name: Tiltólista
        run: python3 scripts/tiltolista.py
